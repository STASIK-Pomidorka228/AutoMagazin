spring:
  application:
    name: AutoMagazin

  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
